<!DOCTYPE html>
<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .body {
        background-color: rgb(143, 151, 240);
        font-family: 'Roboto', sans-serif;
        display: flex;
        flex-direction: column;
        justify-items: center;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        font-size: 1.5rem;
    }

    h1 {
        font-size:2.5rem;
    }

    .surface {
        background-color: white;
        border-radius: .75rem;
        padding: .3rem;
        display: flex;
        flex-direction: column;
        width: 90%;
        gap: .3rem;
        align-items: center;
        padding: 1rem;
    }

    h1 {
        margin-inline: auto;
        color: black;
        padding: .66rem;
    }

    p {
        color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        vertical-align: middle;
        text-align: center;
    }

    footer {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
</style>

<body class="body">
    <div class="surface">
        <header>
            <h1>{{heading}}</h1>
        </header>
        <main>
            {{htmlBody}}
        </main>
    </div>
    <div class="surface">
        <footer>
            <strong>{{applicationName}} {{DateTime.UtcNow.Year}}</strong>
        </footer>
    </div>
</body>

</html>
